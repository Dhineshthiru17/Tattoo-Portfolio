    <path d="M762 222C905 280 998 374 1041 505C1084 638 1158 733 1265 789" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>
    <path d="M808 152C996 245 1112 368 1154 520C1188 640 1266 742 1390 827" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  </g>

  <g transform="translate(1058 228) rotate(-18)" filter="url(#shadow)">
