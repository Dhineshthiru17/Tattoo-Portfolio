<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Modern ink studio background</title>
  <desc id="desc">Abstract modern tattoo studio artwork with flowing ink lines, needle silhouette, and red light accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060607"/>
      <stop offset="46%" stop-color="#111015"/>
      <stop offset="100%" stop-color="#2a0d13"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d55" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff3d55" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#8e939d"/>
      <stop offset="100%" stop-color="#ff6b78"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blurLine" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.56"/>
    </filter>
  </defs>

  <rect width="1800" height="1050" fill="url(#bg)"/>
  <rect width="1800" height="1050" fill="url(#grid)"/>

  <g opacity="0.9">
    <path d="M698 0L1800 0L1800 1050L1068 1050Z" fill="#ffffff" opacity="0.035"/>
    <path d="M1116 0L1800 0L1800 1050L1472 1050Z" fill="#ff3d55" opacity="0.08"/>
    <path d="M1230 0L1350 0L740 1050L620 1050Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <g filter="url(#blurLine)" opacity="0.72">
    <path d="M589 775C782 607 948 623 1106 487C1260 355 1287 190 1473 108" fill="none" stroke="url(#redGlow)" stroke-width="28"/>
    <path d="M702 891C915 708 1094 723 1267 571C1432 426 1485 242 1706 162" fill="none" stroke="#ff3d55" stroke-opacity="0.24" stroke-width="18"/>
  </g>

