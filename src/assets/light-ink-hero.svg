<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Light modern ink studio background</title>
  <desc id="desc">Abstract light modern tattoo studio artwork with flowing ink lines, needle silhouette, and pink accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#fdfbfb"/>
      <stop offset="100%" stop-color="#fef6f8"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#000000" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
    <filter id="blurLine" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <style>
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }
      @keyframes float-reverse {
        0% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      @keyframes drawLine {
        from { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        to { stroke-dasharray: 1000; stroke-dashoffset: 0; }
      }
      .floating-line { animation: float 12s ease-in-out infinite; }
      .floating-line-reverse { animation: float-reverse 15s ease-in-out infinite; }
      .pulse-circle { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .draw-line-1 { animation: drawLine 8s ease-out infinite alternate; }
      .draw-line-2 { animation: drawLine 10s ease-out infinite alternate; }
      .draw-line-3 { animation: drawLine 12s ease-out infinite alternate; }
      .draw-line-4 { animation: drawLine 14s ease-out infinite alternate; }
      .draw-line-5 { animation: drawLine 16s ease-out infinite alternate; }
      .flower-path-1 { animation: drawLine 20s ease-in-out infinite alternate; }
      .flower-path-2 { animation: drawLine 18s ease-in-out infinite alternate; }
      .float-machine { animation: float 8s ease-in-out infinite; }
      .spin-shape { animation: float 6s ease-in-out infinite; }
      .spin-shape-reverse { animation: float-reverse 7s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="url(#bg)"/>
  <rect width="1800" height="1050" fill="url(#grid)"/>

  <g opacity="0.9">
    <path d="M698 0L1800 0L1800 1050L1068 1050Z" fill="#000000" opacity="0.01"/>
    <path d="M1116 0L1800 0L1800 1050L1472 1050Z" fill="#ec4899" opacity="0.03"/>
    <path d="M1230 0L1350 0L740 1050L620 1050Z" fill="#000000" opacity="0.015"/>
  </g>

  <g filter="url(#blurLine)" opacity="0.72">
    <path class="floating-line" d="M589 775C782 607 948 623 1106 487C1260 355 1287 190 1473 108" fill="none" stroke="url(#pinkGlow)" stroke-width="28"/>
    <path class="floating-line-reverse" d="M702 891C915 708 1094 723 1267 571C1432 426 1485 242 1706 162" fill="none" stroke="#ec4899" stroke-opacity="0.1" stroke-width="18"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw-line-1" d="M541 780C768 582 924 655 1097 473C1222 342 1281 180 1493 85" stroke="#000000" stroke-opacity="0.15" stroke-width="2.5"/>
    <path class="draw-line-2" d="M574 836C810 643 997 685 1158 524C1322 360 1395 224 1586 127" stroke="#ec4899" stroke-opacity="0.3" stroke-width="4"/>
    <path class="draw-line-3" d="M661 911C861 741 1088 760 1281 580C1440 431 1534 270 1736 197" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>
    <path class="draw-line-4" d="M762 222C905 280 998 374 1041 505C1084 638 1158 733 1265 789" stroke="#000000" stroke-opacity="0.05" stroke-width="2"/>
    <path class="draw-line-5" d="M808 152C996 245 1112 368 1154 520C1188 640 1266 742 1390 827" stroke="#000000" stroke-opacity="0.04" stroke-width="2"/>
  </g>

  <g class="float-machine" transform="translate(1058 228) rotate(-18)" filter="url(#shadow)">
    <rect x="240" y="180" width="70" height="425" rx="35" fill="#f8fafc" stroke="#000000" stroke-opacity="0.05" stroke-width="3"/>
    <rect x="256" y="140" width="38" height="160" rx="19" fill="#e2e8f0" stroke="#ec4899" stroke-opacity="0.2" stroke-width="3"/>
    <path d="M276 0L322 149H230Z" fill="url(#metal)"/>
    <path d="M276 0L322 149H230Z" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="4"/>
    <path d="M276 25V145" stroke="#f1f5f9" stroke-opacity="0.8" stroke-width="3"/>
    <rect x="204" y="314" width="144" height="62" rx="31" fill="#ec4899" opacity="0.15"/>
    <rect x="204" y="314" width="144" height="62" rx="31" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M215 480H337" stroke="#000000" stroke-opacity="0.08" stroke-width="10"/>
  </g>

  <g transform="translate(1098 603)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.76">
    <path class="flower-path-1" d="M54 235C133 185 171 118 166 35C249 72 303 144 319 250C222 229 136 225 54 235Z" stroke="#000000" stroke-opacity="0.15" stroke-width="4"/>
    <path class="flower-path-2" d="M92 219C161 170 190 116 184 62C243 99 275 157 284 229" stroke="#ec4899" stroke-opacity="0.3" stroke-width="5"/>
    <path class="flower-path-3" d="M119 210C150 173 166 127 166 69" stroke="#000000" stroke-opacity="0.1" stroke-width="3"/>
    <path class="flower-path-4" d="M204 79C180 138 184 188 217 229" stroke="#000000" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <g opacity="0.5">
    <circle class="pulse-circle" cx="1454" cy="724" r="3" fill="#000000"/>
    <circle class="pulse-circle" cx="1512" cy="676" r="2" fill="#ec4899"/>
    <circle class="pulse-circle" cx="1327" cy="187" r="2.5" fill="#000000"/>
    <circle class="pulse-circle" cx="1604" cy="328" r="3" fill="#ec4899"/>
    <path class="spin-shape" d="M1498 797l12 26 29 4-21 20 5 29-25-14-25 14 5-29-21-20 29-4z" fill="#000000" opacity="0.08"/>
    <path class="spin-shape-reverse" d="M1650 523l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#ec4899" opacity="0.15"/>
  </g>
</svg>
